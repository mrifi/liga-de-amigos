<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liga de Amigos</title>
<meta name="description" content="Tu liga de fútbol con tus amigos: alineaciones, fichajes, estadio y partidos en directo.">
<meta name="theme-color" content="#06100b">
<link rel="icon" href="img/comp/liga.webp">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE  partido de noche entre amigos: glamour de estadio con focos (A) y el vestuario donde se decide la táctica (C)
   IDEA   el club se gestiona como una noche de partido: marcador LED ámbar para las cifras, focos blancos para el texto,
          y en el vestuario la pizarra táctica con cinta amarilla de utillero
   PICTURE escenas generadas por sección (estadio, vestuario, entreno, despacho) bajo un velo verde noche; la pizarra en la alineación
   COLOUR fondo verde noche #06100b, tablero #0d1b13, focos #f2f5ee, LED ámbar #ffb21c, césped #2ea24b, pizarra #1c2723, cinta #f5d238
   TYPE   Big Shoulders Display (rótulos de estadio) para títulos y cifras + Barlow para texto */
:root{color-scheme:dark;
  --disp:"Big Shoulders Display","Barlow Condensed","Arial Narrow",sans-serif;--cond:var(--disp);--body:Barlow,system-ui,sans-serif;
  --bg:#06100b;--surface:#0c1a12;--surface2:#122519;--surface3:#183020;--line:rgba(214,240,220,.1);--line2:rgba(214,240,220,.18);
  --ink:#f2f5ee;--mute:#97ab9d;--amber:#ffb21c;--amber2:#ff8f0a;--amber-ink:#2a1700;--gold:var(--amber);--gold2:var(--amber2);
  --pitch:#33ad52;--pitch2:#1f7d38;--pitch3:#145426;--red:#ec4d55;--good:#4bd474;--warn:#ffb21c;
  --slate:#1c2723;--chalk:#e8ece4;--tape:#f5d238;--tape-ink:#1d1704;
  --glass:var(--surface);--glass2:var(--surface2);--r:14px}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
::selection{background:var(--amber);color:var(--amber-ink)}
html{scrollbar-color:#2c4636 transparent}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);overflow-x:clip;-webkit-tap-highlight-color:transparent;min-height:100vh;caret-color:var(--amber)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,16,11,.5) 0%,rgba(6,16,11,.88) 42%,var(--bg) 78%),var(--bgimg,none) center top/cover no-repeat;transition:background-image .3s}
body[data-bg=stadium]{--bgimg:url(img/stadium.webp)}body[data-bg=vestuario]{--bgimg:url(img/vestuario.webp)}body[data-bg=entreno]{--bgimg:url(img/entreno.webp)}body[data-bg=despacho]{--bgimg:url(img/despacho.webp)}body[data-bg=aereo]{--bgimg:url(img/estadio-aereo.webp)}
button,select,input{font:inherit;color:inherit}
a{color:var(--amber);text-underline-offset:3px}
h1,h2,h3,h4,.num{font-family:var(--disp);line-height:1.02;margin:0;text-wrap:balance}
h2{font-size:30px;font-weight:900;text-transform:uppercase;letter-spacing:.01em}
h3{font-size:21px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.ic{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.14em}
.boot{padding:60px 16px;text-align:center;color:var(--mute)}

/* cabecera */
.top{background:linear-gradient(180deg,#081509,rgba(6,16,11,.94));border-bottom:1px solid var(--line);padding:10px max(16px,4vw) 0;position:sticky;top:0;z-index:20}
.top .row{display:flex;align-items:center;gap:8px;max-width:1180px;margin:0 auto;padding-bottom:10px}
.top .club{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.top .club>div{min-width:0}
.top .club b{font-family:var(--disp);font-size:22px;font-weight:900;line-height:1;display:block;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .club small{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.cash,.tokchip{display:flex;align-items:center;gap:5px;font-family:var(--disp);font-weight:800;font-size:20px;white-space:nowrap;background:#030805;border:1px solid var(--line2);border-radius:10px;padding:3px 9px 3px 5px;min-height:36px;font-variant-numeric:tabular-nums;color:var(--amber);letter-spacing:.02em}
.cash .ic,.tokchip .ic{width:24px;height:24px}
.cash i{display:none}
.cash.neg{color:#ff8a90}
.tokchip{cursor:pointer;color:#c8f5d2}
.tokchip:hover{border-color:var(--pitch)}
nav.tabs{display:flex;max-width:1180px;margin:0 auto;gap:2px}
nav.tabs button{flex:1;background:none;border:0;color:var(--mute);padding:6px 4px 9px;font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;min-height:54px;display:flex;flex-direction:column;align-items:center;gap:3px;border-bottom:3px solid transparent}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button[aria-current=true]{color:var(--ink);border-color:var(--amber)}
nav.tabs button[aria-current=true] svg{color:var(--amber)}
nav.tabs button:hover{color:var(--ink)}

/* estructura */
main{max-width:1180px;margin:0 auto;padding:16px max(16px,4vw) 120px}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel>h3,.panel>.ph{margin-bottom:12px}
.panel+.panel,.stackp>*+*{margin-top:16px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ph h3,.ph h2{flex:1 1 auto}
.mute{color:var(--mute)}
.small{font-size:14px}
p{margin:.4em 0}
/* pestañas secundarias: una sola línea, como los rótulos de una retransmisión */
.sub{display:flex;gap:2px;margin:-4px -4px 14px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);padding:0 4px}
.sub::-webkit-scrollbar{display:none}
.sub button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 8px;font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;min-height:46px;color:var(--mute);white-space:nowrap}
.sub button:hover{color:var(--ink)}
.sub button[aria-pressed=true]{color:var(--amber);border-color:var(--amber)}

/* botones con relieve, como los de un juego de móvil */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(180deg,#45c565,var(--pitch) 55%,#2a9a48);color:#fff;border:0;border-radius:11px;padding:10px 18px;font-family:var(--disp);font-weight:900;font-size:18px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;min-height:46px;text-decoration:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 3px 0 var(--pitch3),0 6px 12px rgba(0,0,0,.35);text-shadow:0 1px 0 rgba(0,0,0,.25);line-height:1}
.btn .ic{width:20px;height:20px}
.btn.y{background:linear-gradient(180deg,#ffd15a,var(--amber) 55%,#f59c0b);color:var(--amber-ink);text-shadow:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 0 #a35a00,0 6px 12px rgba(0,0,0,.35)}
.btn.g{background:linear-gradient(180deg,#45c565,var(--pitch) 55%,#2a9a48)}
.btn.ghost{background:rgba(242,245,238,.05);color:var(--ink);border:1px solid var(--line2);box-shadow:none;text-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
.btn.red{background:linear-gradient(180deg,#ff6a72,var(--red) 55%,#cf323b);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 3px 0 #7d1219,0 6px 12px rgba(0,0,0,.35)}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none;filter:saturate(.4)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:16px;border-radius:9px}
.btn.sm .ic{width:16px;height:16px}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
select,input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password]{background:#050c08;border:1px solid var(--line2);border-radius:10px;padding:9px 10px;min-height:44px;font-size:16px;width:100%;color:var(--ink)}
select:hover,input:hover{border-color:#3d5b47}
input::placeholder{color:#6f8576}
label.f{display:block;font-size:14px;font-weight:600;color:var(--mute)}
label.f>*{margin-top:4px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
input[type=range]{accent-color:var(--amber)}
input[type=checkbox]{accent-color:var(--pitch)}

/* insignias, camisetas, estrellas */
.crest{filter:drop-shadow(0 3px 4px rgba(0,0,0,.55))}
.shirt{flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.stars{display:inline-flex;gap:1px;vertical-align:-2px}
.st{width:13px;height:13px;background:#2f4637;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.st.f{background:var(--amber)}.st.h{background:linear-gradient(90deg,var(--amber) 50%,#2f4637 50%)}

/* portada del partido */
.hero{position:relative;border-radius:16px;overflow:hidden;padding:16px;background:linear-gradient(180deg,rgba(6,16,11,.15),rgba(6,16,11,.72) 45%,rgba(6,16,11,.96) 78%),url(img/stadium.webp) center 28%/cover;border:1px solid var(--line2)}
.hero .meta{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:#cddbd1;flex-wrap:wrap;font-weight:600}
.hero .meta b{font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:15px;color:var(--ink)}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;margin:18px 0 12px}
.vs .t{text-align:center}
.vs .t b{display:block;font-family:var(--disp);font-size:21px;font-weight:900;margin-top:6px;line-height:1.05;text-transform:uppercase;text-shadow:0 2px 6px #000}
.vs .t small{color:#cddbd1;font-size:13px}
/* marcador LED */
.score{font-family:var(--disp);font-weight:900;font-size:clamp(46px,11vw,66px);line-height:1;white-space:nowrap;text-align:center;color:var(--ink);padding:4px 10px}
.score small{display:inline-block;margin-top:6px;font-size:22px;font-weight:800;color:var(--amber);text-align:center;background:#030805;border:1px solid #3a2a07;border-radius:8px;padding:3px 10px;font-variant-numeric:tabular-nums;letter-spacing:.06em}
.live{display:inline-flex;align-items:center;gap:6px;color:#fff;font-weight:800;background:var(--red);border-radius:6px;padding:1px 8px;font-family:var(--disp);font-size:16px;text-transform:uppercase;letter-spacing:.05em}
.live i{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.2}}
.cmp{display:grid;grid-template-columns:2.4em minmax(0,1fr) 4.2em minmax(0,1fr) 2.4em;gap:6px;align-items:center;font-size:14px;margin-top:6px}
.cmp .l{text-align:center;color:#cddbd1;font-weight:800;font-family:var(--disp);font-size:15px;letter-spacing:.06em}
.cmp .n{font-family:var(--disp);font-weight:900;font-size:19px;text-align:center;font-variant-numeric:tabular-nums}
.bar{height:8px;background:rgba(242,245,238,.1);border-radius:2px;overflow:hidden;display:flex}
.bar.r{justify-content:flex-end}
.bar i{display:block;height:100%;background:var(--amber);border-radius:2px}
.bar:not(.r) i{background:var(--pitch)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.acts .btn{flex:1 1 140px}
.evs{list-style:none;margin:10px 0 0;padding:0}
.evs li{display:grid;grid-template-columns:3em 1.6em minmax(0,1fr);gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.evs .mn{font-family:var(--disp);font-weight:800;color:var(--amber)}
.ico{width:18px;height:18px;display:inline-block;vertical-align:-3px}

/* listas */
.rows{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 6px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;cursor:pointer;min-height:58px;border-radius:0;color:var(--ink)}
.prow:first-child{border-top:0}
.prow:hover{background:rgba(242,245,238,.035)}
.av{position:relative;display:flex;align-items:center}
.av .pos{position:absolute;bottom:-3px;right:-6px;font-size:11px;padding:0 4px;border-radius:3px}
.pos{font-family:var(--disp);font-weight:900;font-size:14px;text-align:center;border-radius:4px;padding:2px 5px;color:#fff;line-height:1.15;letter-spacing:.03em}
.pos.G{background:#d98a06}.pos.D{background:#2a6fd8}.pos.M{background:#23963f}.pos.A{background:#d6343f}
.pname{font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname small{display:block;font-weight:500;color:var(--mute);font-size:13px}
.ovr{font-family:var(--disp);font-weight:900;font-size:28px;text-align:right;min-width:1.6em;color:var(--ink);font-variant-numeric:tabular-nums}
.val{font-size:14px;color:var(--mute);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.cond{display:block;width:60px;height:5px;border-radius:2px;background:rgba(242,245,238,.12);margin-top:4px;overflow:hidden}
.cond i{display:block;height:100%;background:var(--good)}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:4px;padding:0 6px;margin-left:4px;vertical-align:1px;letter-spacing:.02em}
.tag.inj{background:var(--red);color:#fff}.tag.sus{background:var(--amber);color:var(--amber-ink)}.tag.ia{background:rgba(242,245,238,.06);color:var(--mute);border:1px solid var(--line)}.tag.me{background:var(--amber);color:var(--amber-ink)}
.grp{font-family:var(--disp);font-weight:900;font-size:17px;margin:16px 0 2px;color:var(--amber);text-transform:uppercase;letter-spacing:.06em}

/* alineación: pizarra del vestuario */
.pitch{position:relative;aspect-ratio:68/88;max-height:74vh;margin:0 auto;border-radius:10px;overflow:hidden;background:radial-gradient(120% 70% at 30% 20%,rgba(232,236,228,.07),transparent 60%),radial-gradient(90% 60% at 80% 85%,rgba(232,236,228,.05),transparent 60%),var(--slate);border:10px solid #5b3d22;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),inset 0 0 50px rgba(0,0,0,.45),0 10px 24px rgba(0,0,0,.45)}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%;color:rgba(232,236,228,.6)}
.pitch svg.lines *{stroke:rgba(232,236,228,.55)!important}
.tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;cursor:pointer;width:78px;padding:0;color:#fff}
.tok .jw{position:relative;display:grid;place-items:center}
.tok .jw b{position:absolute;top:13px;font-family:var(--disp);font-weight:900;font-size:16px}
.tok .ring{position:absolute;inset:-3px;border-radius:50%;border:3px solid transparent}
.tok.mid .jw::after,.tok.bad .jw::after{content:"";position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:var(--warn);border:2px solid var(--slate)}
.tok.bad .jw::after{background:var(--red)}
.tok.out .jw{opacity:.55}
.tok.sel .jw{filter:drop-shadow(0 0 0 var(--tape)) drop-shadow(0 3px 6px rgba(0,0,0,.6));transform:scale(1.08)}
.tok.sel .n{background:var(--amber)}
/* nombre en cinta de utillero */
.tok .n{font-family:var(--disp);font-size:13px;font-weight:900;letter-spacing:.02em;text-transform:uppercase;background:var(--tape);color:var(--tape-ink);border-radius:1px;padding:0 6px;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.4);transform:rotate(-1.5deg)}
.tok:nth-child(even) .n{transform:rotate(1.2deg)}
.tok .e{width:34px;height:4px;border-radius:2px;background:rgba(232,236,228,.25);overflow:hidden;margin-top:1px}.tok .e i{display:block;height:100%;background:var(--good)}
.tok.empty .jw{opacity:.75}
.tok.empty .n{background:transparent;color:var(--chalk);box-shadow:none;border:1px dashed rgba(232,236,228,.5)}
.bench{display:flex;gap:4px;overflow-x:auto;padding:12px 6px 6px;background:var(--slate);border-radius:10px;margin-top:10px}
.bench .tok{position:static;transform:none;flex:none}
/* en el vestuario los títulos van en cinta */
body[data-bg=vestuario] .panel>h3,body[data-bg=vestuario] .ph>h3,body[data-bg=entreno] .panel>h3,body[data-bg=entreno] .ph>h3{flex:none;display:inline-block;background:var(--tape);color:var(--tape-ink);padding:3px 10px 2px;transform:rotate(-.8deg);box-shadow:0 1px 3px rgba(0,0,0,.45);font-size:19px}
.str{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.str div{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.str b{display:block;font-family:var(--disp);font-size:30px;font-weight:900;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.str span{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;font-weight:700}

/* tabla */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-family:var(--disp);font-size:14px;color:var(--mute);font-weight:800;text-align:right;padding:6px 5px;border-bottom:1px solid var(--line2);text-transform:uppercase;letter-spacing:.05em}
td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:nth-child(2),td:nth-child(2){text-align:left}
th:first-child,td:first-child{text-align:center;width:2em}
td:first-child{font-family:var(--disp);font-weight:900;font-size:18px}
tr:nth-child(1) td:first-child{color:var(--amber)}
tr.me td{background:rgba(255,178,28,.1)}
tr.me td:last-child{color:var(--amber);font-weight:800}
td .tn{display:flex;align-items:center;gap:8px;font-weight:700}
td .tn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.form{display:inline-flex;gap:3px}.form i{width:9px;height:9px;border-radius:2px;background:var(--mute)}.form i.G{background:var(--good)}.form i.P{background:var(--red)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 5em minmax(0,1fr);gap:8px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer;min-height:58px;color:var(--ink)}
.mrow:first-child{border-top:0}
.mrow:hover{background:rgba(242,245,238,.035)}
.mrow .h{display:flex;align-items:center;gap:8px;justify-content:flex-end;text-align:right;font-weight:700}
.mrow .a{display:flex;align-items:center;gap:8px;font-weight:700}
.mrow .h span,.mrow .a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .sc{font-family:var(--disp);font-weight:900;font-size:22px;text-align:center;background:#030805;border:1px solid var(--line2);border-radius:8px;padding:2px 0;white-space:nowrap;color:var(--amber);font-variant-numeric:tabular-nums}
.mrow .sc.lv{background:var(--red);border-color:var(--red);color:#fff}
.mrow .sc small{display:block;font-size:11px;color:var(--mute);line-height:1;font-family:var(--body);font-weight:700}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5em,1fr));gap:10px}
.kv div{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px}
.kv b{display:block;font-family:var(--disp);font-size:26px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.kv span{font-size:13px;color:var(--mute)}
.big{font-family:var(--disp);font-weight:900;font-size:clamp(40px,9vw,58px);line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.note{background:rgba(255,178,28,.08);border:1px solid rgba(255,178,28,.32);border-radius:10px;padding:10px 12px;font-size:15px}
.note.bad{background:rgba(236,77,85,.1);border-color:rgba(236,77,85,.45)}
.ledger{list-style:none;margin:0;padding:0}
